# /etc/nginx/sites-available/radar  ->  ln -s в sites-enabled, затем: nginx -t && systemctl reload nginx
# Пароль:  sudo apt install apache2-utils && sudo htpasswd -c /etc/nginx/radar.htpasswd team
# HTTPS:   sudo apt install certbot python3-certbot-nginx && sudo certbot --nginx -d radar.example.com

server {
    listen 80;
    server_name radar.example.com;        # ваш домен; для доступа по IP поставьте _

    root /opt/radar/site;                 # наружу отдаётся только папка site, база и .git не видны
    index index.html;

    auth_basic "Radar";
    auth_basic_user_file /etc/nginx/radar.htpasswd;

    location / {
        try_files $uri $uri/ =404;
    }
    location /data/ {
        add_header Cache-Control "no-store";   # страница всегда берёт свежие данные
    }
    location ~ /\. {
        deny all;
    }
}
