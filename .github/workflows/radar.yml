name: Радар

on:
  schedule:
    - cron: "17 */4 * * *"   # обычный прогон каждые 4 часа (время UTC)
    - cron: "43 4 * * 1"     # понедельник, 07:43 МСК: обогащение карточек и дайджест
  workflow_dispatch:
    inputs:
      task:
        description: "Что запустить"
        type: choice
        default: run
        options: [run, weekly, review, check]

permissions:
  contents: write

concurrency:
  group: radar
  cancel-in-progress: false

jobs:
  radar:
    runs-on: ubuntu-latest
    timeout-minutes: 30
    outputs:
      task: ${{ steps.task.outputs.task }}
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: pip

      - run: pip install -q -r requirements.txt

      - name: Какая задача
        id: task
        env:
          EVENT: ${{ github.event_name }}
          CHOSEN: ${{ inputs.task }}
          CRON: ${{ github.event.schedule }}
        run: |
          if [ "$EVENT" = "workflow_dispatch" ]; then task="$CHOSEN"
          elif [ "$CRON" = "43 4 * * 1" ]; then task="weekly"
          else task="run"; fi
          echo "task=$task" >> "$GITHUB_OUTPUT"

      - name: Радар
        env:
          TASK: ${{ steps.task.outputs.task }}
          ANTHROPIC_API_KEY: ${{ secrets.ANTHROPIC_API_KEY }}
          # необязательно: уведомления в Telegram-чат команды
          TELEGRAM_BOT_TOKEN: ${{ secrets.TELEGRAM_BOT_TOKEN }}
          TELEGRAM_CHAT_ID: ${{ secrets.TELEGRAM_CHAT_ID }}
          # необязательно: другая модель с OpenAI-совместимым API вместо Claude
          OPENAI_COMPAT_BASE_URL: ${{ vars.OPENAI_COMPAT_BASE_URL }}
          OPENAI_COMPAT_MODEL: ${{ vars.OPENAI_COMPAT_MODEL }}
          OPENAI_COMPAT_API_KEY: ${{ secrets.OPENAI_COMPAT_API_KEY }}
          # необязательно: тонкая настройка (Settings -> Variables)
          RADAR_MODEL_FAST: ${{ vars.RADAR_MODEL_FAST }}
          RADAR_MODEL_SMART: ${{ vars.RADAR_MODEL_SMART }}
          RADAR_ENRICH_LIMIT: ${{ vars.RADAR_ENRICH_LIMIT }}
          RADAR_MAX_ITEMS_PER_RUN: ${{ vars.RADAR_MAX_ITEMS_PER_RUN }}
        run: python -m radar "$TASK"

      - name: Сохранить базу в репозиторий
        if: steps.task.outputs.task != 'check'
        env:
          TASK: ${{ steps.task.outputs.task }}
        run: |
          git config user.name "radar-bot"
          git config user.email "radar-bot@users.noreply.github.com"
          git add data site/data
          if git diff --cached --quiet; then echo "Изменений нет"; exit 0; fi
          git commit -q -m "radar: $TASK $(date -u +'%Y-%m-%d %H:%M') UTC"
          git pull -q --rebase
          git push -q

  # Вариант размещения Б: GitHub Pages. Страница будет открыта всем, у кого есть ссылка,
  # а на бесплатном тарифе ещё и репозиторий должен быть публичным. Включается переменной
  # DEPLOY_PAGES=true (Settings -> Secrets and variables -> Actions -> Variables).
  pages:
    if: vars.DEPLOY_PAGES == 'true' && needs.radar.outputs.task != 'check'
    needs: radar
    runs-on: ubuntu-latest
    permissions:
      contents: read
      pages: write
      id-token: write
    environment:
      name: github-pages
      url: ${{ steps.deploy.outputs.page_url }}
    steps:
      - uses: actions/checkout@v4
        with:
          ref: ${{ github.ref_name }}   # свежий коммит с данными, а не тот, с которого стартовали
      - uses: actions/configure-pages@v5
      - uses: actions/upload-pages-artifact@v3
        with:
          path: site
      - id: deploy
        uses: actions/deploy-pages@v4
