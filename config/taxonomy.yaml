# Рубрикатор радара. id менять не стоит (на них ссылается база), подписи и подсказки — можно.

categories:
  - {id: aerial,        label: "Летающие",              hint: "БПЛА, дроны, мультикоптеры, дроны-доставщики, дрон-порты"}
  - {id: cleaning,      label: "Клининг",               hint: "уборка полов, мойка фасадов, окон, солнечных панелей, очистка поверхностей"}
  - {id: agro,          label: "Агро",                  hint: "полевые роботы, агродроны, автономные тракторы, сбор урожая, животноводство"}
  - {id: underground,   label: "Подземные и горные",    hint: "шахты, тоннели, коллекторы, трубопроводы изнутри, автономная горная техника"}
  - {id: inspection,    label: "Инспекция и промсервис", hint: "диагностика и обслуживание резервуаров, труб, корпусов судов, ЛЭП, ветряков; краулеры"}
  - {id: logistics,     label: "Склад и логистика",     hint: "AMR, AGV, сортировка, комплектация, автоматизированные склады"}
  - {id: delivery,      label: "Доставка и транспорт",  hint: "роботы-курьеры, беспилотные грузовики и такси"}
  - {id: manufacturing, label: "Промроботы и коботы",   hint: "манипуляторы, сварка, покраска, роботизированные ячейки"}
  - {id: humanoid,      label: "Гуманоиды",             hint: "человекоподобные и универсальные роботы"}
  - {id: construction,  label: "Стройка",               hint: "разметка, кладка, отделка, 3D-печать зданий, автономная стройтехника"}
  - {id: marine,        label: "Морские",               hint: "подводные и надводные аппараты, очистка корпусов"}
  - {id: medical,       label: "Медицина",              hint: "хирургические, реабилитационные, лабораторные роботы"}
  - {id: service,       label: "Сервисные",             hint: "HoReCa, ритейл, домашние и консьюмерские роботы"}
  - {id: security,      label: "Охрана",                hint: "патрулирование, мониторинг периметра"}
  - {id: components,    label: "Компоненты и ПО",       hint: "приводы, сенсоры, захваты, ИИ и софт для роботов"}
  - {id: other,         label: "Прочее",                hint: "всё, что не подошло выше"}

event_types:
  - {id: funding,     label: "Инвестиции"}
  - {id: product,     label: "Новый продукт"}
  - {id: contract,    label: "Контракт / внедрение"}
  - {id: pilot,       label: "Пилот / испытания"}
  - {id: partnership, label: "Партнёрство"}
  - {id: ma,          label: "M&A"}
  - {id: ipo,         label: "IPO / биржа"}
  - {id: financials,  label: "Финансы и метрики"}
  - {id: regulation,  label: "Регулирование"}
  - {id: shutdown,    label: "Закрытие / сокращения"}
  - {id: research,    label: "Исследования"}
  - {id: other,       label: "Другое"}

stages:
  - {id: concept,      label: "Концепт"}
  - {id: prototype,    label: "Прототип"}
  - {id: pilot,        label: "Пилот"}
  - {id: serial,       label: "Серия"}
  - {id: discontinued, label: "Снят"}
  - {id: unknown,      label: "—"}

# «Наши ниши»: события и компании из этих ниш подсвечиваются и попадают в уведомления.
# Сейчас — под продукты Astramis; меняйте под себя.
focus_niches:
  - id: facade
    label: "Фасады и высотный клининг"
    hint: "дроны и роботы для мойки фасадов, окон, остекления, солнечных панелей; высотные работы с привязным питанием"
  - id: floor
    label: "Промышленная уборка полов"
    hint: "автономные поломоечные и подметальные машины для складов, цехов, ТЦ, паркингов"
  - id: tank
    label: "Резервуары и металлоконструкции"
    hint: "роботы на магнитных гусеницах или колёсах: абразивная очистка, окраска, инспекция резервуаров, корпусов судов, труб"
