# Стартовый каркас базы: известные игроки по рубрикам и прямые аналоги в «наших нишах».
# Здесь только название, страна и рубрика — без цифр. Сайт, раунды, выручку и парк
# дописывает еженедельное обогащение (python -m radar enrich) со ссылками на источники.
# Список составлен по памяти модели: если компания закрылась или переехала,
# обогащение это поправит, а ручные правки кладите в config/overrides.yaml.
#
# country — ISO-код страны штаб-квартиры; focus — id ниши из taxonomy.yaml

